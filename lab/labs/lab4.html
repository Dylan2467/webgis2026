<html>
<head>
  <title>North Carolina COVID-19 by ZIP</title>
  <script src="https://cdn.jsdelivr.net/npm/ol@10.11.0/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;color:#222}
    header{background:#1f3864;color:#fff;padding:10px 16px}
    header h3{margin:0}
    #app{display:flex;flex-wrap:wrap;gap:10px;padding:10px}
    #controls{flex:1 1 280px;background:#fff;border-radius:6px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
    #controls label{display:block;margin:8px 0 4px;font-weight:bold;font-size:13px}
    #controls select,#controls button{width:100%;padding:6px;margin-bottom:6px;box-sizing:border-box}
    #stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .statcard{flex:1;min-width:90px;background:#eef2f7;border-radius:6px;padding:8px;text-align:center}
    .statcard b{display:block;font-size:18px}
    .statcard span{font-size:11px;color:#555}
    #mapwrap{flex:2 1 500px;min-width:300px}
    #map{height:520px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
    #charts{flex:1 1 100%;display:flex;gap:10px;flex-wrap:wrap}
    .chartbox{flex:1;min-width:280px;background:#fff;border-radius:6px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
    #summarybox{flex:1 1 100%;background:#fff;border-radius:6px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.15);font-size:13px}
    .ol-popup{position:absolute;background:#fff;border-radius:6px;padding:8px 10px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px;max-width:260px}
  </style>
</head>
<body>
<header><h3>North Carolina COVID-19 by ZIP</h3></header>
<div id="app">
  <div id="controls">
    <label for="dateSelect">Snapshot date</label>
    <select id="dateSelect"></select>
    <label for="metricSelect">Metric</label>
    <select id="metricSelect">
      <option value="cases">Cumulative cases</option>
      <option value="deaths">Cumulative deaths</option>
      <option value="rate">Rate per 1,000 residents</option>
      <option value="lisa">Local Moran’s I clusters (cases)</option>
    </select>
    <button id="downloadCsvBtn">Download CSV</button>
    <button id="downloadGeojsonBtn">Download GeoJSON</button>
    <div id="stats">
      <div class="statcard"><b id="statCases">—</b><span>Total cases</span></div>
      <div class="statcard"><b id="statDeaths">—</b><span>Total deaths</span></div>
      <div class="statcard"><b id="statZips">—</b><span>ZIPs reporting</span></div>
    </div>
  </div>
  <div id="mapwrap"><div id="map"></div></div>
  <div id="charts">
    <div class="chartbox"><canvas id="totalsChart" height="180"></canvas></div>
    <div class="chartbox"><canvas id="dailyChart" height="180"></canvas></div>
  </div>
  <div id="summarybox" id="summary"></div>
</div>
<div id="popup" class="ol-popup" style="display:none"></div>
<script>
const DATA_ROOT='https://raw.githubusercontent.com/mtdukes/nc-covid-by-zip/master/time_series_data/';
const COUNTY_URL='https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_CountyBoundariesER/FeatureServer/0/query?outFields=*&where=1%3D1&f=geojson';
const dateSelect=document.getElementById('dateSelect');
const metricSelect=document.getElementById('metricSelect');
const summary=document.getElementById('summary');
let map,zipLayer,countyLayer,totalsChart,dailyChart;
let currentData=null;

function dateRange(){
  const start=new Date('2020-05-02');
  const end=new Date('2020-10-02');
  const dates=[];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    dates.push(new Date(d).toISOString().slice(0,10));
  }
  return dates;
}

function populateDates(){
  const dates=dateRange();
  dateSelect.innerHTML=dates.map(d=>`<option value="${d}">${d}</option>`).join('');
  dateSelect.value=dates[dates.length-1];
}

async function fetchJSON(url){
  const res=await fetch(url);
  if(!res.ok) throw new Error('Fetch failed: '+url);
  return res.json();
}

async function loadSnapshot(dateStr){
  const d=dateStr.replace(/-/g,'');
  const url=`${DATA_ROOT}${d}.json`;
  try{
    return await fetchJSON(url);
  }catch(e){
    summary.textContent='No data available for '+dateStr+'.';
    return null;
  }
}

function initMap(){
  const osm=new ol.layer.Tile({source:new ol.source.OSM()});
  zipLayer=new ol.layer.Vector({source:new ol.source.Vector()});
  countyLayer=new ol.layer.Vector({
    source:new ol.source.Vector(),
    style:new ol.style.Style({
      stroke:new ol.style.Stroke({color:'#333',width:1}),
      fill:new ol.style.Fill({color:'rgba(0,0,0,0)'})
    })
  });
  map=new ol.Map({
    target:'map',
    layers:[osm,countyLayer,zipLayer],
    view:new ol.View({center:ol.proj.fromLonLat([-79.0,35.5]),zoom:7})
  });
  new ResizeObserver(()=>map.updateSize()).observe(document.getElementById('map'));

  map.on('pointermove',evt=>{
    const feat=map.forEachFeatureAtPixel(evt.pixel,f=>f);
    const popup=document.getElementById('popup');
    if(feat){
      const p=feat.getProperties();
      let html=`<b>ZIP ${esc(p.zip||'')}</b><br>Cases: ${esc(p.cases)}<br>Deaths: ${esc(p.deaths)}<br>Pop: ${esc(p.totalPop)}`;
      if(p._cluster){html+=`<hr><b>Local Moran’s I:</b> ${esc(p._cluster)}`;if(p._localI!==null)html+=` (I=${p._localI.toFixed(3)})`;}
      popup.innerHTML=html;
      popup.style.left=(evt.pixel[0]+12)+'px';
      popup.style.top=(evt.pixel[1]+12)+'px';
      popup.style.display='block';
    }else{
      popup.style.display='none';
    }
  });
}

function esc(v){return v===undefined||v===null?'—':String(v);}

async function loadCounties(){
  const geo=await fetchJSON(COUNTY_URL);
  const feats=new ol.format.GeoJSON().readFeatures(geo,{featureProjection:'EPSG:3857'});
  countyLayer.getSource().addFeatures(feats);
}

function colorForCases(v,max){
  if(v===null||v===undefined) return 'rgba(200,200,200,0.5)';
  const t=max>0?Math.min(1,v/max):0;
  const r=255,g=Math.round(255*(1-t)),b=Math.round(80*(1-t));
  return `rgba(${r},${g},${b},0.75)`;
}

function colorForLISA(cluster){
  switch(cluster){
    case 'HH':return 'rgba(214,39,40,0.8)';
    case 'LL':return 'rgba(31,119,180,0.8)';
    case 'HL':return 'rgba(255,152,150,0.8)';
    case 'LH':return 'rgba(174,199,232,0.8)';
    default:return 'rgba(200,200,200,0.4)';
  }
}

function buildNeighbors(features){
  const neighbors=features.map(()=>new Set());
  for(let i=0;i<features.length;i++){
    const gi=features[i].getGeometry();
    const ei=gi.getExtent();
    for(let j=i+1;j<features.length;j++){
      const gj=features[j].getGeometry();
      const ej=gj.getExtent();
      if(ol.extent.intersects(ei,ej)){
        neighbors[i].add(j);
        neighbors[j].add(i);
      }
    }
  }
  return neighbors;
}

function computeLocalMoran(features,values){
  const n=values.length;
  const mean=values.reduce((a,b)=>a+b,0)/n;
  const variance=values.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n;
  if(variance===0){
    summary.textContent="All reported ZIP case counts are equal; Local Moran’s I is undefined.";return}
  const z=values.map(v=>(v-mean)/Math.sqrt(variance));
  const neighbors=buildNeighbors(features);
  const I=new Array(n).fill(null);
  const cluster=new Array(n).fill(null);
  for(let i=0;i<n;i++){
    const nbrs=[...neighbors[i]];
    if(nbrs.length===0) continue;
    const wsum=nbrs.reduce((s,j)=>s+z[j],0)/nbrs.length;
    I[i]=z[i]*wsum;
    let perm=0;
    for(let p=0;p<999;p++){
      const idx=[...Array(n).keys()].filter(k=>k!==i);
      for(let k=idx.length-1;k>0;k--){
        const r=Math.floor(Math.random()*(k+1));
        [idx[k],idx[r]]=[idx[r],idx[k]];
      }
      const sampled=nbrs.map((_,k)=>z[idx[k%idx.length]]);
      const wsumP=sampled.reduce((s,v)=>s+v,0)/sampled.length;
      if(Math.abs(z[i]*wsumP)>=Math.abs(I[i])) perm++;
    }
    const pval=(perm+1)/1000;
    if(pval<=0.05){
      if(z[i]>=0&&wsum>=0) cluster[i]='HH';
      else if(z[i]<0&&wsum<0) cluster[i]='LL';
      else if(z[i]>=0&&wsum<0) cluster[i]='HL';
      else cluster[i]='LH';
    }
  }
  return {I,cluster,n,attrs:{mean,variance}};
}

function renderMetric(features,metric){
  let max=0;
  if(metric==='cases'||metric==='deaths') max=Math.max(...features.map(f=>f.get(metric)||0));
  if(metric==='rate') max=Math.max(...features.map(f=>{
    const pop=f.get('totalPop')||0;
    return pop>0?(f.get('cases')||0)/pop*1000:0;
  }));

  let lisaResult=null;
  if(metric==='lisa'){
    const valid=features.filter(f=>typeof f.get('cases')==='number');
    const vals=valid.map(f=>f.get('cases'));
    lisaResult=computeLocalMoran(valid,vals);
    if(lisaResult){
      valid.forEach((f,i)=>{
        f.set('_cluster',lisaResult.cluster[i]);
        f.set('_localI',lisaResult.I[i]);
      });
      summary.textContent=`Local Moran’s I for reported cases · ${lisaResult.n} ZIPs with values · variance=${lisaResult.attrs.variance.toFixed(2)}`;
    }
  }

  features.forEach(f=>{
    let color;
    if(metric==='cases') color=colorForCases(f.get('cases'),max);
    else if(metric==='deaths') color=colorForCases(f.get('deaths'),max);
    else if(metric==='rate'){
      const pop=f.get('totalPop')||0;
      const rate=pop>0?(f.get('cases')||0)/pop*1000:0;
      color=colorForCases(rate,max);
    }else if(metric==='lisa'){
      color=colorForLISA(f.get('_cluster'));
    }
    f.setStyle(new ol.style.Style({
      image:new ol.style.Circle({
        radius:5,
        fill:new ol.style.Fill({color}),
        stroke:new ol.style.Stroke({color:'#333',width:0.5})
      })
    }));
  });
}

function updateCharts(seriesDates,totalsCases,totalsDeaths){
  const dailyIncrease=totalsCases.map((v,i)=>i===0?0:v-totalsCases[i-1]);
  if(totalsChart) totalsChart.destroy();
  if(dailyChart) dailyChart.destroy();
  totalsChart=new Chart(document.getElementById('totalsChart'),{
    type:'line',
    data:{labels:seriesDates,datasets:[
      {label:'Cumulative cases',data:totalsCases,borderColor:'#d62728',fill:false},
      {label:'Cumulative deaths',data:totalsDeaths,borderColor:'#1f3864',fill:false}
    ]},
    options:{responsive:true,plugins:{title:{display:true,text:'Statewide cumulative totals'}}}
  });
  dailyChart=new Chart(document.getElementById('dailyChart'),{
    type:'bar',
    data:{labels:seriesDates,datasets:[{label:'Daily reported increase (cases)',data:dailyIncrease,backgroundColor:'#ff9896'}]},
    options:{responsive:true,plugins:{title:{display:true,text:'Daily reported increase'}}}
  });
}

function toGeoJSON(data){
  const features=Object.entries(data).map(([zip,rec])=>({
    type:'Feature',
    properties:{zip,cases:rec.cases||0,deaths:rec.deaths||0,totalPop:rec.totalPop||0},
    geometry:{type:'Point',coordinates:[rec.lon||0,rec.lat||0]}
  }));
  return {type:'FeatureCollection',features};
}

function downloadBlob(content,filename,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

function toCSV(data){
  const rows=[['zip','cases','deaths','totalPop']];
  Object.entries(data).forEach(([zip,rec])=>{
    rows.push([zip,rec.cases||0,rec.deaths||0,rec.totalPop||0]);
  });
  return rows.map(r=>r.join(',')).join('\n');
}

async function refresh(){
  const dateStr=dateSelect.value;
  const data=await loadSnapshot(dateStr);
  if(!data) return;
  currentData=data;
  const geo=toGeoJSON(data);
  const feats=new ol.format.GeoJSON().readFeatures(geo,{featureProjection:'EPSG:3857'});
  zipLayer.getSource().clear();
  zipLayer.getSource().addFeatures(feats);
  renderMetric(feats,metricSelect.value);

  const totalCases=feats.reduce((s,f)=>s+(f.get('cases')||0),0);
  const totalDeaths=feats.reduce((s,f)=>s+(f.get('deaths')||0),0);
  document.getElementById('statCases').textContent=totalCases.toLocaleString();
  document.getElementById('statDeaths').textContent=totalDeaths.toLocaleString();
  document.getElementById('statZips').textContent=feats.length;

  const dates=dateRange().filter(d=>d<=dateStr);
  const sampleDates=dates.filter((_,i)=>i%7===0 || i===dates.length-1);
  const totalsCases=[],totalsDeaths=[];
  for(const d of sampleDates){
    const snap=await loadSnapshot(d);
    if(snap){
      totalsCases.push(Object.values(snap).reduce((s,r)=>s+(r.cases||0),0));
      totalsDeaths.push(Object.values(snap).reduce((s,r)=>s+(r.deaths||0),0));
    }else{
      totalsCases.push(totalsCases[totalsCases.length-1]||0);
      totalsDeaths.push(totalsDeaths[totalsDeaths.length-1]||0);
    }
  }
  updateCharts(sampleDates,totalsCases,totalsDeaths);
}

document.getElementById('downloadCsvBtn').addEventListener('click',()=>{
  if(!currentData) return;
  downloadBlob(toCSV(currentData),`nc_covid_${dateSelect.value}.csv`,'text/csv');
});
document.getElementById('downloadGeojsonBtn').addEventListener('click',()=>{
  if(!currentData) return;
  downloadBlob(JSON.stringify(toGeoJSON(currentData)),`nc_covid_${dateSelect.value}.geojson`,'application/geo+json');
});
dateSelect.addEventListener('change',refresh);
metricSelect.addEventListener('change',refresh);

(async function start(){
  populateDates();
  initMap();
  await loadCounties();
  await refresh();
})();
</script>
</body>
</html>
